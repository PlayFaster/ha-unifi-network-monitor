rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: Integration provides no custom conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: Integration provides no custom triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: Fixed-IP local polling; no discovery, so no discovery-sourced network info.
  discovery:
    status: exempt
    comment:
      Gateway is configured by host/IP with credentials; no zeroconf/SSDP/DHCP
      discovery.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: done
    comment:
      Coordinator raises the "site_resolution_failed" repair issue when v3 site
      resolution fails (disabling VPN/firewall/WAN-name sensors) and clears it on
      recovery.
  stale-devices:
    status: done
    comment:
      async_remove_config_entry_device enables per-device deletion; explicit
      cleanup_unused_entities service/button removes entities/devices the current
      options no longer provide.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
