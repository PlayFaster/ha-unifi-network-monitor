cleanup_unused_entities:
  fields:
    dry_run:
      default: true
      required: false
      selector:
        boolean:

get_alerts:
  fields:
    device_id:
      required: false
      selector:
        device:
          integration: unifi_network_monitor
    severity:
      required: false
      selector:
        select:
          multiple: true
          options:
            - value: LOW
              label: Low (Sev 1)
            - value: MEDIUM
              label: Medium (Sev 2)
            - value: HIGH
              label: High (Sev 3)
            - value: VERY_HIGH
              label: Very High (Sev 4)
    quantity:
      default: 10
      required: false
      selector:
        number:
          min: 1
          max: 100
          mode: box
    age_days:
      required: false
      selector:
        number:
          min: 1
          max: 365
          mode: box
    keyword:
      required: false
      selector:
        text:
