name: Release

"on":
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write # Required to upload the HACS zip as a release asset
    # Branch @main — update SHA after pushing .github changes v2.0.21
    uses: PlayFaster/.github/.github/workflows/release.yaml@377ce919296f6c372f06b292649bc5682d28fa43
    with:
      component_name: unifi_network_monitor
      tag: ${{ github.event.release.tag_name }}
