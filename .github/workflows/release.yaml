name: Release

"on":
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write # Required to upload the HACS zip as a release asset
    # Branch @main — update SHA after pushing .github changes v2.0.19
    uses: PlayFaster/.github/.github/workflows/release.yaml@0c410f3b6bf3992d87e56ffc1c04665949882038
    with:
      component_name: unifi_network_monitor
      tag: ${{ github.event.release.tag_name }}
