name: Validate

"on":
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *" # Daily at midnight

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    # Branch @main — update SHA after pushing .github changes v2.0.10
    uses: PlayFaster/.github/.github/workflows/validate.yaml@bd40d667b8c09451824f722cfaa03bf1f786b38f
    with:
      category: integration
      component_name: unifi_network_monitor
      gist_id: a26a356246076e5172fc9342fb019361
    secrets:
      GIST_SECRET: ${{ secrets.GIST_SECRET }}
